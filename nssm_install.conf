# ============================================================
# Hermes Gateway NSSM Service Configuration
# ============================================================
#
# NSSM (Non-Sucking Service Manager) 安装步骤:
#
# 1. 下载 NSSM: https://nssm.cc/download
# 2. 解压到 C:\tools\
# 3. 以管理员身份运行以下命令:
#
#    C:\tools\nssm.exe install HermesGateway
#
#    然后在 NSSM GUI 中配置:
#    - Application Path: C:\Users\Administrator\AppData\Local\hermes\hermes-agent\venv\Scripts\python.exe
#    - Arguments: C:\Users\Administrator\AppData\Local\hermes\hermes-agent\hermes_cli\main.py gateway
#    - Startup directory: C:\Users\Administrator\AppData\Local\hermes\hermes-agent
#    - Environment: HERMES_HOME=C:\Users\Administrator\AppData\Local\hermes
#
# 或命令行安装:
#    C:\tools\nssm.exe install HermesGateway "C:\Users\Administrator\AppData\Local\hermes\hermes-agent\venv\Scripts\python.exe" "C:\Users\Administrator\AppData\Local\hermes\hermes-agent\hermes_cli\main.py gateway"
#    C:\tools\nssm.exe set HermesGateway AppDirectory "C:\Users\Administrator\AppData\Local\hermes\hermes-agent"
#    C:\tools\nssm.exe set HermesGateway Env HERMES_HOME=C:\Users\Administrator\AppData\Local\hermes
#    C:\tools\nssm.exe start HermesGateway
#
# 常用命令:
#    C:\tools\nssm.exe start HermesGateway
#    C:\tools\nssm.exe stop HermesGateway
#    C:\tools\nssm.exe restart HermesGateway
#    C:\tools\nssm.exe remove HermesGateway
#    C:\tools\nssm.exe edit HermesGateway    (GUI配置)
#    C:\tools\nssm.exe status HermesGateway
#
# ============================================================

Application:
  python.exe
  C:\Users\Administrator\AppData\Local\hermes\hermes-agent\hermes_cli\main.py gateway

Startup directory:
  C:\Users\Administrator\AppData\Local\hermes\hermes-agent

Environment:
  HERMES_HOME=C:\Users\Administrator\AppData\Local\hermes
  _HERMES_GATEWAY=1

Details:
  Name: HermesGateway
  Display name: Hermes Agent Gateway
  Description: Hermes Agent Messaging Gateway - 消息网关服务
  Startup type: Automatic

Logging:
  AppRotate: 1
  AppMaxFiles: 5
  AppMaxSize: 10485760
